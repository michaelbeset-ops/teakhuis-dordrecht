<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Volgorde | Beheer Teakhuis</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <!-- Volgorde van de meubels binnen een categorie of collectie bepalen door te slepen (Han, 16 nov).
         Werkt met de inlog van het beheer (Sveltia bewaart het toegangstoken in localStorage onder "sveltia-cms.user").
         Leest de actuele bestanden uit GitHub en slaat alle gewijzigde producten op in een enkele commit:
         categorie -> veld "volgorde", collectie -> veld "volgordeCollectie" (10, 20, 30, ...). -->
    <style>
      :root { --inkt:#17201b; --grijs:#55605a; --blad:#6aab35; --blad-h:#5c9a2a; --diep:#36641a; --papier:#fbfaf7; --zand:#f1eee7; --lijn:#e3ddd1; --rood:#a3301f; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--papier); color: var(--inkt); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
      header { position: sticky; top: 0; z-index: 5; background: #fff; border-bottom: 1px solid var(--lijn); }
      .rij { max-width: 860px; margin: 0 auto; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
      a.terug { color: var(--diep); font-weight: 600; text-decoration: none; margin-right: auto; }
      h1 { font-size: 20px; margin: 0; }
      main { max-width: 860px; margin: 0 auto; padding: 16px 16px 120px; }
      .kies { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 4px 0 14px; }
      .tabs { display: inline-flex; border: 1px solid var(--lijn); border-radius: 999px; overflow: hidden; background: #fff; }
      .tabs button { border: 0; background: none; padding: 9px 16px; font: inherit; font-weight: 600; cursor: pointer; color: var(--grijs); }
      .tabs button[aria-pressed="true"] { background: var(--inkt); color: #fff; }
      select { font: inherit; padding: 9px 12px; border: 1px solid var(--lijn); border-radius: 10px; background: #fff; min-width: 260px; max-width: 100%; }
      .uitleg { color: var(--grijs); font-size: 14px; margin: 0 0 12px; }
      ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
      li { display: flex; align-items: center; gap: 12px; background: #fff; border: 1px solid var(--lijn); border-radius: 12px; padding: 6px 10px 6px 6px; user-select: none; }
      li .greep { cursor: grab; color: #9aa39d; padding: 8px 4px; touch-action: none; display: grid; place-items: center; }
      li .nr { width: 2.2em; text-align: right; color: var(--grijs); font-variant-numeric: tabular-nums; font-size: 14px; flex: none; }
      li img, li .geen { width: 52px; height: 52px; border-radius: 8px; object-fit: contain; background: var(--zand); flex: none; }
      li .naam { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      li .naam small { display: block; font-weight: 400; color: var(--grijs); }
      li .pijl { border: 1px solid var(--lijn); background: #fff; border-radius: 8px; width: 34px; height: 34px; cursor: pointer; font-size: 15px; color: var(--grijs); flex: none; }
      li .pijl:hover { background: var(--zand); color: var(--inkt); }
      li.verborgen { opacity: .55; }
      li.sleep-geest { opacity: .35; background: var(--zand); }
      li.sleep-gekozen { box-shadow: 0 10px 30px -10px #17201b55; }
      .balk { position: fixed; inset: auto 0 0 0; background: #fff; border-top: 1px solid var(--lijn); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); z-index: 6; }
      .balk .rij { padding: 0; }
      .status { margin-right: auto; color: var(--grijs); font-size: 14px; }
      .status.fout { color: var(--rood); font-weight: 600; }
      .status.goed { color: var(--diep); font-weight: 600; }
      button.knop { font: inherit; font-weight: 700; border-radius: 999px; padding: 11px 22px; cursor: pointer; border: 1.5px solid var(--lijn); background: #fff; color: var(--inkt); }
      button.knop.blad { background: var(--blad); border-color: var(--blad); color: var(--inkt); }
      button.knop.blad:hover { background: var(--blad-h); }
      button.knop:disabled { opacity: .45; cursor: default; }
      .melding { background: #fff; border: 1px solid var(--lijn); border-radius: 12px; padding: 20px; }
    </style>
  </head>
  <body>
    <header>
      <div class="rij">
        <a class="terug" href="./">&larr; Terug naar het beheer</a>
        <h1>Volgorde van de meubels</h1>
      </div>
    </header>
    <main>
      <div class="kies">
        <div class="tabs" role="group" aria-label="Soort lijst">
          <button type="button" data-soort="categorie" aria-pressed="true">Categorie</button>
          <button type="button" data-soort="collectie" aria-pressed="false">Collectie</button>
        </div>
        <label><span hidden>Kies</span><select id="keuze" disabled><option>Laden...</option></select></label>
      </div>
      <p class="uitleg" id="uitleg">Sleep een meubel aan het bolletjesrijtje naar de goede plek, of gebruik de pijltjes. Klik daarna onderaan op <b>Opslaan</b>. Na ongeveer 3 minuten staat de nieuwe volgorde op de site.</p>
      <div id="inhoud"><p class="melding">Even geduld, de meubels worden geladen...</p></div>
    </main>
    <div class="balk">
      <div class="rij">
        <span class="status" id="status"></span>
        <button type="button" class="knop" id="herstel" disabled>Ongedaan maken</button>
        <button type="button" class="knop blad" id="opslaan" disabled>Opslaan</button>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
    <script>
      (async () => {
        const OWNER = 'michaelbeset-ops', REPO = 'teakhuis-dordrecht', BRANCH = 'main';
        const MAP = { producten: 'src/content/producten', categorieen: 'src/content/categorieen', collecties: 'src/content/collecties' };
        const $ = (s) => document.querySelector(s);
        const inhoud = $('#inhoud'), keuze = $('#keuze'), status = $('#status'), opslaan = $('#opslaan'), herstel = $('#herstel');
        const zeg = (t, soort = '') => { status.textContent = t; status.className = 'status ' + soort; };
        const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
        const nl = new Intl.Collator('nl', { numeric: true });

        let token = '';
        try { token = JSON.parse(localStorage.getItem('sveltia-cms.user') || 'null')?.token || ''; } catch {}
        if (!token) {
          inhoud.innerHTML = '<p class="melding">Je bent nog niet ingelogd. Ga eerst naar <a href="./">het beheer</a>, log in en kom dan terug via de knop <b>Volgorde slepen</b>.</p>';
          return;
        }
        const gh = async (pad, opties = {}) => {
          const r = await fetch('https://api.github.com' + pad, { ...opties, headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json', ...(opties.headers || {}) } });
          if (!r.ok) throw new Error(`GitHub ${r.status}: ${(await r.text()).slice(0, 200)}`);
          return r.json();
        };

        // Kleine foto's per product, gemaakt bij het bouwen van de site (nieuwe producten krijgen er een na de volgende build).
        let fotos = {};
        fetch('volgorde-fotos.json').then((r) => (r.ok ? r.json() : {})).then((j) => { fotos = j; tekenFotos(); }).catch(() => {});

        let producten = [], categorieen = [], collecties = [], basis = '';
        const laad = async () => {
          const map = (p) => `${p.replace(/\W/g, '_')}: object(expression: "${BRANCH}:${MAP[p]}") { ... on Tree { entries { name object { ... on Blob { text } } } } }`;
          const q = `query { repository(owner: "${OWNER}", name: "${REPO}") { ref(qualifiedName: "refs/heads/${BRANCH}") { target { oid } } ${Object.keys(MAP).map(map).join(' ')} } }`;
          const r = await gh('/graphql', { method: 'POST', body: JSON.stringify({ query: q }) });
          if (r.errors) throw new Error(r.errors.map((e) => e.message).join('; '));
          const repo = r.data.repository;
          basis = repo.ref.target.oid;
          const lees = (k) => (repo[k]?.entries || []).filter((e) => e.name.endsWith('.json') && e.object?.text).map((e) => {
            try { return { slug: e.name.replace(/\.json$/, ''), tekst: e.object.text, data: JSON.parse(e.object.text) }; } catch { return null; }
          }).filter(Boolean);
          producten = lees('producten'); categorieen = lees('categorieen'); collecties = lees('collecties');
        };

        try { await laad(); } catch (e) {
          inhoud.innerHTML = `<p class="melding">De meubels konden niet worden geladen. Log opnieuw in via <a href="./">het beheer</a> en probeer het nog eens.<br><small>${esc(e.message)}</small></p>`;
          return;
        }

        const getal = (v, std = 999) => (v === '' || v === null || v === undefined || isNaN(+v) ? std : +v);
        let soort = 'categorie', lijst = [], begin = [];
        const veld = () => (soort === 'categorie' ? 'volgorde' : 'volgordeCollectie');
        const huidig = (p) => (soort === 'categorie' ? getal(p.data.volgorde) : getal(p.data.volgordeCollectie, getal(p.data.volgorde)));

        const vulKeuze = () => {
          const tel = new Map();
          const sleutel = soort === 'categorie' ? 'categorie' : 'collectie';
          for (const p of producten) if (p.data[sleutel]) tel.set(p.data[sleutel], (tel.get(p.data[sleutel]) || 0) + 1);
          let opties;
          if (soort === 'categorie') {
            const opSlug = new Map(categorieen.map((c) => [c.slug, c]));
            const hoofdVan = (c) => (c.data.hoofd ? opSlug.get(c.data.hoofd) : null);
            opties = categorieen.filter((c) => tel.get(c.slug)).map((c) => {
              const h = hoofdVan(c);
              return { slug: c.slug, naam: (h ? `${h.data.naam} › ` : '') + c.data.naam, sort: [getal(h ? h.data.volgorde : c.data.volgorde), h ? getal(c.data.volgorde) : -1, c.data.naam] };
            }).sort((a, b) => a.sort[0] - b.sort[0] || a.sort[1] - b.sort[1] || nl.compare(a.naam, b.naam));
          } else {
            opties = collecties.filter((c) => tel.get(c.slug)).map((c) => ({ slug: c.slug, naam: c.data.naam, sort: [getal(c.data.volgorde)] }))
              .sort((a, b) => a.sort[0] - b.sort[0] || nl.compare(a.naam, b.naam));
          }
          const vorige = sessionStorage.getItem('volgorde-' + soort);
          keuze.innerHTML = '<option value="">Kies een ' + soort + '...</option>' + opties.map((o) => `<option value="${esc(o.slug)}">${esc(o.naam)} (${tel.get(o.slug)})</option>`).join('');
          keuze.disabled = false;
          if (vorige && opties.some((o) => o.slug === vorige)) keuze.value = vorige;
          toon();
        };

        let sortable;
        const toon = () => {
          const k = keuze.value;
          try { sessionStorage.setItem('volgorde-' + soort, k); } catch {}
          if (!k) { inhoud.innerHTML = '<p class="melding">Kies hierboven een ' + soort + '.</p>'; lijst = begin = []; wijzig(); return; }
          const sleutel = soort === 'categorie' ? 'categorie' : 'collectie';
          lijst = producten.filter((p) => p.data[sleutel] === k).sort((a, b) => huidig(a) - huidig(b) || nl.compare(a.data.titel, b.data.titel));
          begin = lijst.slice();
          teken();
        };
        const teken = () => {
          inhoud.innerHTML = '<ol id="lijst">' + lijst.map((p, i) => `
            <li data-slug="${esc(p.slug)}" class="${p.data.zichtbaar === false ? 'verborgen' : ''}">
              <span class="greep" title="Slepen" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg></span>
              <span class="nr">${i + 1}</span>
              <span class="geen" data-foto></span>
              <span class="naam">${esc(p.data.titel)}${p.data.zichtbaar === false ? '<small>verborgen op de site</small>' : ''}</span>
              <button type="button" class="pijl" data-op="-1" aria-label="Omhoog">&uarr;</button>
              <button type="button" class="pijl" data-op="1" aria-label="Omlaag">&darr;</button>
            </li>`).join('') + '</ol>';
          tekenFotos();
          const ol = $('#lijst');
          sortable = Sortable.create(ol, { handle: '.greep', animation: 150, ghostClass: 'sleep-geest', chosenClass: 'sleep-gekozen', onEnd: leesVolgorde });
          ol.addEventListener('click', (e) => {
            const b = e.target.closest('.pijl'); if (!b) return;
            const li = b.closest('li'), op = +b.dataset.op;
            const ander = op < 0 ? li.previousElementSibling : li.nextElementSibling;
            if (!ander) return;
            op < 0 ? ol.insertBefore(li, ander) : ol.insertBefore(ander, li);
            leesVolgorde();
            b.focus();
          });
          wijzig();
        };
        const tekenFotos = () => document.querySelectorAll('li[data-slug]').forEach((li) => {
          const src = fotos[li.dataset.slug], plek = li.querySelector('[data-foto]');
          if (src && plek && plek.tagName !== 'IMG') { const img = new Image(); img.src = src; img.alt = ''; img.loading = 'lazy'; img.dataset.foto = ''; plek.replaceWith(img); }
        });
        const leesVolgorde = () => {
          const opSlug = new Map(lijst.map((p) => [p.slug, p]));
          lijst = [...document.querySelectorAll('#lijst li')].map((li) => opSlug.get(li.dataset.slug));
          document.querySelectorAll('#lijst .nr').forEach((n, i) => (n.textContent = i + 1));
          wijzig();
        };
        const gewijzigd = () => {
          // Nieuwe nummers 10, 20, 30, ...; alleen bestanden waarvan het getal echt verandert worden opgeslagen.
          const f = veld();
          return lijst.map((p, i) => ({ p, nieuw: (i + 1) * 10 })).filter(({ p, nieuw }) => getal(p.data[f], NaN) !== nieuw);
        };
        const zelfdeVolgorde = () => lijst.every((p, i) => p === begin[i]);
        const wijzig = () => {
          const anders = lijst.length && !zelfdeVolgorde();
          opslaan.disabled = !lijst.length || (!anders && !gewijzigd().length);
          herstel.disabled = !anders;
          if (anders) zeg('Nog niet opgeslagen.');
          else if (status.className.indexOf('goed') < 0) zeg('');
        };
        herstel.addEventListener('click', () => { lijst = begin.slice(); teken(); zeg(''); });

        opslaan.addEventListener('click', async () => {
          const te = gewijzigd();
          if (!te.length) { begin = lijst.slice(); wijzig(); zeg('De volgorde was al zo opgeslagen.', 'goed'); return; }
          opslaan.disabled = herstel.disabled = true; keuze.disabled = true;
          zeg('Bezig met opslaan...');
          const f = veld();
          try {
            const ref = await gh(`/repos/${OWNER}/${REPO}/git/ref/heads/${BRANCH}`);
            const top = ref.object.sha;
            const commit = await gh(`/repos/${OWNER}/${REPO}/git/commits/${top}`);
            const tree = [];
            for (const { p, nieuw } of te) {
              // Opnieuw lezen van de laatste versie, zodat een wijziging die Han net in het beheer deed niet verloren gaat.
              const vers = await gh(`/repos/${OWNER}/${REPO}/contents/${MAP.producten}/${encodeURIComponent(p.slug)}.json?ref=${top}`);
              const tekst = new TextDecoder().decode(Uint8Array.from(atob(vers.content.replace(/\n/g, '')), (c) => c.charCodeAt(0)));
              const data = JSON.parse(tekst);
              data[f] = nieuw;
              p.data = data;
              tree.push({ path: `${MAP.producten}/${p.slug}.json`, mode: '100644', type: 'blob', content: JSON.stringify(data, null, 2) + '\n' });
            }
            const naam = keuze.options[keuze.selectedIndex].text.replace(/\s*\(\d+\)$/, '');
            const nieuweTree = await gh(`/repos/${OWNER}/${REPO}/git/trees`, { method: 'POST', body: JSON.stringify({ base_tree: commit.tree.sha, tree }) });
            const nieuweCommit = await gh(`/repos/${OWNER}/${REPO}/git/commits`, { method: 'POST', body: JSON.stringify({ message: `Beheer: volgorde van ${soort} "${naam}" aangepast`, tree: nieuweTree.sha, parents: [top] }) });
            await gh(`/repos/${OWNER}/${REPO}/git/refs/heads/${BRANCH}`, { method: 'PATCH', body: JSON.stringify({ sha: nieuweCommit.sha }) });
            begin = lijst.slice();
            zeg(`Opgeslagen. Over ongeveer 3 minuten staat de nieuwe volgorde op de site.`, 'goed');
          } catch (e) {
            zeg('Opslaan is niet gelukt. Probeer het nog eens, of bel Michael. (' + e.message.slice(0, 80) + ')', 'fout');
          } finally {
            keuze.disabled = false; wijzig();
          }
        });

        keuze.addEventListener('change', () => {
          if (!opslaan.disabled && !zelfdeVolgorde() && !confirm('De nieuwe volgorde is nog niet opgeslagen. Toch een andere lijst kiezen?')) { keuze.value = sessionStorage.getItem('volgorde-' + soort) || ''; return; }
          zeg(''); toon();
        });
        document.querySelectorAll('[data-soort]').forEach((b) => b.addEventListener('click', () => {
          if (b.dataset.soort === soort) return;
          if (!zelfdeVolgorde() && !confirm('De nieuwe volgorde is nog niet opgeslagen. Toch wisselen?')) return;
          soort = b.dataset.soort;
          document.querySelectorAll('[data-soort]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
          zeg(''); vulKeuze();
        }));
        window.addEventListener('beforeunload', (e) => { if (lijst.length && !zelfdeVolgorde()) e.preventDefault(); });
        vulKeuze();
      })();
    </script>
  </body>
</html>
