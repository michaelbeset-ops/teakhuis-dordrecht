<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Beheer | Teakhuis</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <style>
      /* Foto's toevoegen moet in een oogopslag duidelijk zijn: een rustige knop "Foto's kiezen", zonder "plakken". */
      .drop-target button[data-label="Bladeren"], .drop-target button[data-label="Browse"] {
        background: #fff !important; color: #36641a !important; border: 1.5px solid #6aab35 !important;
        border-radius: 999px !important; padding: 0 16px !important; height: 34px !important; font-size: 0 !important;
        box-shadow: 0 1px 2px rgba(23, 32, 27, .08) !important; transition: background .15s, color .15s;
      }
      .drop-target button[data-label="Bladeren"]::after, .drop-target button[data-label="Browse"]::after {
        content: "+  Foto's kiezen"; font-size: 14px; font-weight: 600; white-space: pre;
      }
      .drop-target button[data-label="Bladeren"]:hover, .drop-target button[data-label="Browse"]:hover {
        background: #6aab35 !important; color: #fff !important;
      }
      .drop-target button[data-label="Afbeelding plakken"], .drop-target button[data-label="Paste Image"] { display: none !important; }
    </style>
  </head>
  <body>
    <!-- Sveltia CMS: beheer van producten, categorieen en instellingen. Wijzigingen worden opgeslagen in GitHub en
         de site wordt daarna automatisch opnieuw gebouwd (2 tot 4 minuten). Handleiding: BEHEER.md in de repository. -->
    <script>
      // De knop "Inloggen met GitHub" werkt pas met een eigen inlogdienst (base_url in config.yml, zie BEHEER.md). Tot die
      // er is, verbergen we hem, zodat alleen "Inloggen met een toegangstoken" overblijft en niemand op een kapotte knop klikt.
      new MutationObserver(() => {
        document.querySelectorAll('button').forEach((b) => {
          const t = b.textContent || '';
          if (/github/i.test(t) && !/token/i.test(t) && !b.hidden && !b.closest('[role="dialog"]')) b.hidden = true;
        });
      }).observe(document.documentElement, { childList: true, subtree: true });
    </script>
    <script src="https://unpkg.com/@sveltia/cms@0.227.4/dist/sveltia-cms.js"></script>
    <script src="preview.js"></script>
    <!-- Knop naar de sleeppagina voor de volgorde van meubels binnen een categorie of collectie (Han, 16 nov). -->
    <a href="volgorde.html" id="volgorde-knop" title="Bepaal de volgorde van de meubels door te slepen"
       style="position:fixed;right:18px;bottom:18px;z-index:9999;display:flex;align-items:center;gap:8px;padding:11px 18px;border-radius:999px;background:#17201b;color:#fff;font:600 14px/1 system-ui,sans-serif;text-decoration:none;box-shadow:0 8px 24px -8px #17201b88">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16M3 8l4-4 4 4M17 20V4M13 16l4 4 4-4"/></svg>
      Volgorde slepen
    </a>
    <script>
      // Alleen tonen na het inloggen (dan bestaat het toegangstoken).
      const vk = document.getElementById('volgorde-knop');
      const tv = () => { let t = ''; try { t = JSON.parse(localStorage.getItem('sveltia-cms.user') || 'null')?.token || ''; } catch {} vk.hidden = !t; };
      tv(); setInterval(tv, 2000);
    </script>
  </body>
</html>
