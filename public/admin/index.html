<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Beheer | Teakhuis</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <style>
      /* Foto's toevoegen moet in een oogopslag duidelijk zijn: een rustige knop "Foto's kiezen", zonder "plakken". */
      .drop-target button[data-label="Bladeren"], .drop-target button[data-label="Browse"] {
        background: #fff !important; color: #36641a !important; border: 1.5px solid #6aab35 !important;
        border-radius: 999px !important; padding: 0 16px !important; height: 34px !important; font-size: 0 !important;
        box-shadow: 0 1px 2px rgba(23, 32, 27, .08) !important; transition: background .15s, color .15s;
      }
      .drop-target button[data-label="Bladeren"]::after, .drop-target button[data-label="Browse"]::after {
        content: "+  Foto's kiezen"; font-size: 14px; font-weight: 600; white-space: pre;
      }
      .drop-target button[data-label="Bladeren"]:hover, .drop-target button[data-label="Browse"]:hover {
        background: #6aab35 !important; color: #fff !important;
      }
      .drop-target button[data-label="Afbeelding plakken"], .drop-target button[data-label="Paste Image"] { display: none !important; }
    </style>
  </head>
  <body>
    <!-- Sveltia CMS: beheer van producten, categorieen en instellingen. Wijzigingen worden opgeslagen in GitHub en
         de site wordt daarna automatisch opnieuw gebouwd (2 tot 4 minuten). Handleiding: BEHEER.md in de repository. -->
    <script src="https://unpkg.com/@sveltia/cms@0.227.4/dist/sveltia-cms.js"></script>
    <script src="preview.js"></script>
  </body>
</html>
