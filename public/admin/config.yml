# Beheersysteem Teakhuis (Sveltia CMS). Uitleg voor de eigenaar: zie BEHEER.md in de repository.
backend:
  name: github
  repo: michaelbeset-ops/teakhuis-dordrecht
  branch: main
  # Inloggen met een GitHub-knop (zonder token) vraagt een kleine auth-dienst; zie BEHEER.md, "Inloggen".
  # base_url: https://teakhuis-cms-auth.<account>.workers.dev
  commit_messages:
    create: 'Beheer: {{collection}} "{{slug}}" toegevoegd'
    update: 'Beheer: {{collection}} "{{slug}}" bijgewerkt'
    delete: 'Beheer: {{collection}} "{{slug}}" verwijderd'
    uploadMedia: 'Beheer: foto "{{path}}" toegevoegd'
    deleteMedia: 'Beheer: foto "{{path}}" verwijderd'

site_url: https://teakhuis.nl
display_url: https://teakhuis.nl
logo_url: logo.png

# Foto's van producten staan in src/assets/producten; Astro maakt er bij het bouwen kleine, snelle webp-versies van.
# De globale map is alleen voor de mediabibliotheek; producten en categorieen hebben hun eigen (relatieve) map.
media_folder: src/assets/producten
public_folder: /src/assets/producten
media_libraries:
  default:
    config:
      max_file_size: 15000000
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2400
          height: 2400

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: '-'

collections:
  - name: producten
    label: Producten
    label_singular: Product
    description: 'Klik op een product om het aan te passen, of op "Nieuw product". Vergeet niet op "Opslaan" te drukken.'
    folder: src/content/producten
    format: json
    extension: json
    create: true
    delete: true
    slug: '{{titel}}'
    identifier_field: titel
    summary: '{{titel}}{{zichtbaar | ternary("", "  (verborgen)")}}'
    sortable_fields:
      fields: [titel]
      default: { field: titel, direction: ascending }
    view_groups:
      - { label: Categorie, field: categorie }
    editor:
      preview: false
    # Relatief aan het productbestand, zodat Astro de foto's vindt en optimaliseert.
    media_folder: ../../assets/producten
    public_folder: ../../assets/producten
    # Alleen wat nodig is staat in beeld. Technische velden (SEO, volgorde, oude adressen) zijn verborgen:
    # ze blijven bewaard en de site vult ze zelf in als ze leeg zijn.
    fields:
      - { label: Naam, name: titel, widget: string, hint: 'Bijvoorbeeld: Eettafel Viking' }
      - label: Categorie
        name: categorie
        widget: relation
        collection: categorieen
        value_field: '{{slug}}'
        search_fields: [naam]
        display_fields: [naam]
        hint: In welk menu staat dit product?
      - label: Foto's
        name: fotos
        widget: image
        multiple: true
        required: false
        hint: De eerste foto is de hoofdfoto.
      - label: Prijs vanaf (€)
        name: prijsVanaf
        widget: number
        value_type: float
        min: 0
        required: false
        hint: Alleen het getal, bijvoorbeeld 899. Leeg laten = "prijs op aanvraag".
      - label: Omschrijving
        name: omschrijving
        widget: markdown
        required: false
        buttons: [bold, bulleted-list]
        editor_components: []
        minimal: true
      - label: Maten
        name: maten
        widget: list
        required: false
        summary: '{{label}}{{prijs | ternary("  ·  € ", "")}}{{prijs}}'
        hint: Klik op "Toevoegen" voor een maat. Prijs mag leeg blijven.
        fields:
          - { label: Maat, name: label, widget: string, hint: 'Bijvoorbeeld: 200 x 100 cm' }
          - { label: Prijs (€), name: prijs, widget: number, value_type: float, min: 0, required: false }
      - { label: In de vier houtkleuren, name: houtkleuren, widget: boolean, default: false, hint: 'Aan = de klant kiest blank, thee, koloniaal of wit.' }
      - { label: Op de homepage, name: uitgelicht, widget: boolean, default: false }
      - { label: Zichtbaar op de site, name: zichtbaar, widget: boolean, default: true, hint: 'Uit = tijdelijk verbergen zonder te verwijderen.' }
      - { label: Andere uitvoeringen, name: uitvoeringen, widget: list, required: false, field: { label: Uitvoering, name: uitvoering, widget: string }, hint: 'Meestal leeg laten.' }
      - { name: prijsTonen, widget: hidden, default: true }
      - { name: maatwerk, widget: hidden, default: true }
      - { name: volgorde, widget: hidden, default: 999 }
      - { name: seoTitel, widget: hidden, default: '' }
      - { name: seoOmschrijving, widget: hidden, default: '' }
      - { name: oudeUrl, widget: hidden, default: '' }

  - name: categorieen
    label: Categorieën
    label_singular: Categorie
    description: De menu's van de site. Meestal hoef je hier niets te doen.
    folder: src/content/categorieen
    format: json
    extension: json
    create: true
    delete: false
    slug: '{{naam}}'
    identifier_field: naam
    summary: '{{naam}}'
    sortable_fields: [naam]
    editor:
      preview: false
    media_folder: ../../assets/categorieen
    public_folder: ../../assets/categorieen
    fields:
      - { label: Naam, name: naam, widget: string }
      - label: Valt onder
        name: hoofd
        widget: relation
        collection: categorieen
        value_field: '{{slug}}'
        search_fields: [naam]
        display_fields: [naam]
        required: false
        hint: Leeg = eigen menu bovenaan de site.
      - { label: Tekst bovenaan de pagina, name: intro, widget: markdown, required: false, buttons: [bold], editor_components: [], minimal: true }
      - { label: Foto, name: foto, widget: image, required: false }
      - { name: volgorde, widget: hidden, default: 100 }
      - { name: oudeId, widget: hidden, default: '' }

  - name: instellingen
    label: Instellingen
    editor:
      preview: false
    files:
      - name: algemeen
        label: Contactgegevens
        file: src/data/instellingen.json
        format: json
        fields:
          - { label: Telefoonnummer, name: telefoon, widget: string }
          - { label: 'WhatsApp-nummer (internationaal, zonder +)', name: whatsapp, widget: string, hint: 'Bijv. 31640220897' }
          - { label: E-mailadres, name: email, widget: string }
          - { label: Adres, name: adres, widget: string, required: false }
          - { label: KvK-nummer, name: kvk, widget: string, required: false }
          - label: Drie beloftes bovenaan de site
            name: usps
            widget: list
            field: { label: Belofte, name: usp, widget: string }
            max: 3
          # Technisch (formulier, sociale media, Google): beheerd door Sitefront.
          - { name: web3formsKey, widget: hidden, default: '' }
          - { name: emailjs, widget: hidden, default: { service: '', template: '', publicKey: '' } }
          - { name: facebook, widget: hidden, default: '' }
          - { name: instagram, widget: hidden, default: '' }
          - { name: pinterest, widget: hidden, default: '' }
          - { name: google, widget: hidden, default: '' }
          - { name: eigenaar, widget: hidden, default: '' }
      - name: reviews
        label: Reviews
        file: src/data/reviews.json
        format: json
        fields:
          - label: Reviews
            name: reviews
            widget: list
            summary: '{{naam}} ({{bron}})'
            hint: Kies alleen "Google" voor reviews die echt op jullie Google-profiel staan; die krijgen het Google-logo en linken naar het profiel.
            fields:
              - { label: Naam, name: naam, widget: string, hint: 'Zoals op Google, bijv. "Marco B."' }
              - { label: Tekst, name: tekst, widget: text }
              - { label: Bron, name: bron, widget: select, options: [{ label: Google, value: google }, { label: Referentie, value: referentie }], default: google }
              - { label: Sterren (alleen bij Google), name: sterren, widget: number, value_type: int, min: 1, max: 5, required: false }
              - { label: 'Over (bijv. "badkamermeubel")', name: over, widget: string, required: false }
